root = "."
tmp_dir = "tmp"

[build]
  # The API entrypoint is below cmd, while the implementation that changes
  # during development also lives under pkg.
  cmd = "go build -o ./tmp/evolution-go.exe ./cmd/evolution-go"
  entrypoint = "./tmp/evolution-go.exe"
  include_dir = ["cmd", "pkg"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "manager", "manager-v2", "node_modules", "logs"]
  exclude_regex = ["_test.go"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = false
