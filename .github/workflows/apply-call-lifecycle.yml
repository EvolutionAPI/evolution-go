name: Apply call lifecycle hooks

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-call-lifecycle.yml
      - tools/apply_call_lifecycle.py
      - pkg/call/lifecycle/coordinator.go

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/astracalls-integration
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply lifecycle migration
        run: python3 tools/apply_call_lifecycle.py

      - name: Format modified Go files
        run: |
          gofmt -w \
            cmd/evolution-go/main.go \
            pkg/call/service/call_service.go \
            pkg/call/lifecycle/coordinator.go \
            pkg/whatsmeow/service/call_lifecycle.go \
            pkg/whatsmeow/service/whatsmeow.go

      - name: Validate call packages
        run: go test -race ./pkg/call/...

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(call): attach call lifecycle to WhatsApp clients"
          git push origin HEAD:dev/astracalls-integration
