name: Port MLow codec

on:
  pull_request:
    paths:
      - .github/workflows/port-mlow-codec.yml
      - tools/port_mlow_codec.py
      - pkg/call/**

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: dev/astracalls-integration
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Port fixed MLow revision
        run: python3 tools/port_mlow_codec.py

      - name: Format codec implementation
        run: gofmt -w pkg/call/voip/media/codec.go pkg/call/voip/media/mlow_codec.go pkg/call/voip/media/mlow_codec_test.go pkg/call/voip/media/mlow/*.go

      - name: Test default call build
        run: go test -race ./pkg/call/...

      - name: Test experimental Pion build
        run: go test -race -tags=voip_pion ./pkg/call/...

      - name: Commit codec port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(call): port pure Go MLow audio codec"
          git push origin HEAD:dev/astracalls-integration
