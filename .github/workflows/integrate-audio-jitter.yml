name: Integrate audio jitter

on:
  push:
    branches:
      - dev/astracalls-integration
    paths:
      - tools/integrate_audio_jitter.py
      - .github/workflows/integrate-audio-jitter.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: dev/astracalls-integration
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply jitter integration
        run: python3 tools/integrate_audio_jitter.py

      - name: Format changed Go files
        run: |
          gofmt -w \
            pkg/call/voip/media/audio_pipeline.go \
            pkg/call/voip/media/audio_jitter_integration_test.go \
            pkg/call/voip/media/jitter_buffer.go \
            pkg/call/voip/media/jitter_buffer_test.go \
            pkg/call/lifecycle/coordinator.go

      - name: Test default call build
        run: go test -race ./pkg/call/...

      - name: Test experimental Pion build
        run: go test -race -tags=voip_pion ./pkg/call/...

      - name: Commit jitter integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(call): integrate jitter buffer with PCM playout"
          git push origin HEAD:dev/astracalls-integration
