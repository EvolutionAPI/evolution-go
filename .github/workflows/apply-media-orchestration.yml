name: Apply relay orchestration

on:
  pull_request:
    paths:
      - .github/workflows/apply-media-orchestration.yml
      - tools/apply_media_orchestration.py
      - tools/fix_runtime_media_test.py
      - pkg/call/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: dev/astracalls-integration
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply orchestration migration
        run: |
          python3 tools/apply_media_orchestration.py
          python3 tools/fix_runtime_media_test.py

      - name: Format call implementation
        run: |
          gofmt -w \
            pkg/call/lifecycle/coordinator.go \
            pkg/call/runtime/runtime.go \
            pkg/call/runtime/runtime_test.go \
            pkg/call/voip/incoming/relay_bridge.go \
            pkg/call/voip/media/relay_registry.go \
            pkg/call/voip/media/relay_registry_test.go \
            pkg/call/voip/media/ssrc.go \
            pkg/call/voip/media/ssrc_test.go

      - name: Test default build
        run: go test -race ./pkg/call/...

      - name: Test experimental Pion build
        run: go test -race -tags=voip_pion ./pkg/call/...

      - name: Commit orchestration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(call): connect relay transport to call lifecycle"
          git push origin HEAD:dev/astracalls-integration
